<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Silicon Wafer Not Found | ELCHIP</title>
  <link rel="icon" type="image/png" href="tnc-removebg-preview.png?v=3">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Tahoma', 'Verdana', sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .not-found-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 3.5rem 2rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.8);
    }
    .code {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .msg {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .sub {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      color: #000;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="not-found-card">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🔬</div>
    <div class="code">404</div>
    <div class="msg">Cleanroom Defect: Layer Not Found</div>
    <div class="sub">
      The requested semiconductor step or URL path does not exist in the cleanroom fabrication sequence.
    </div>
    <a href="index.html#/" class="btn-home">Return to Silicon Hub &rarr;</a>
  </div>
</body>
</html>
